services:
  frontend:
    # The upstream admin UI is not part of the public Wiki Q&A product.
    # Publishing is performed by publisher.py instead.
    profiles: ["weknora-admin-disabled"]
    ports: !reset []

  app:
    container_name: llm-wiki-public-weknora
    image: llm-wiki-public-weknora:v0.7.2-sqlite-wiki
    build: !override
      context: ../../integrations/llm-wiki-public/weknora-build
      dockerfile: Dockerfile
      additional_contexts:
        weknora-source: ../../services/WeKnora
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file: !override
      - ../../integrations/llm-wiki-public/.env
    environment:
      - DB_DRIVER=sqlite
      - DB_HOST=
      - DB_PORT=
      - DB_USER=
      - DB_PASSWORD=
      - DB_NAME=
      - DB_PATH=/data/weknora/weknora.db
      - RETRIEVE_DRIVER=sqlite
      - REDIS_ADDR=
      - REDIS_USERNAME=
      - REDIS_PASSWORD=
      - REDIS_DB=
      - REDIS_PREFIX=
      - STREAM_MANAGER_TYPE=memory
    depends_on: !override
      docreader:
        condition: service_healthy
    volumes:
      - ../../integrations/llm-wiki-public/builtin_models.yaml:/app/config/builtin_models.yaml:ro
      - weknora-sqlite-data:/data/weknora

  docreader:
    container_name: llm-wiki-public-docreader

  postgres:
    container_name: llm-wiki-public-postgres
    profiles: ["legacy-databases"]

  redis:
    container_name: llm-wiki-public-redis
    profiles: ["legacy-databases"]

  public-bff:
    container_name: llm-wiki-public-bff
    build:
      context: ../../integrations/llm-wiki-public/bff
    env_file:
      - path: ../../integrations/llm-wiki-public/.secrets/runtime.env
        required: false
    environment:
      - PUBLIC_LISTEN_ADDR=${PUBLIC_LISTEN_ADDR:-:8091}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://127.0.0.1:8090}
      - PUBLIC_COOKIE_SECURE=${PUBLIC_COOKIE_SECURE:-false}
      - PUBLIC_COOKIE_SECRET=${PUBLIC_COOKIE_SECRET:-}
      - PUBLIC_CONVERSATION_TTL=${PUBLIC_CONVERSATION_TTL:-168h}
      - PUBLIC_STREAM_TIMEOUT=${PUBLIC_STREAM_TIMEOUT:-120s}
      - PUBLIC_GLOBAL_CONCURRENCY=${PUBLIC_GLOBAL_CONCURRENCY:-20}
      - PUBLIC_TRUSTED_PROXY_CIDRS=${PUBLIC_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - PUBLIC_DB_PATH=/data/public-bff/public-bff.db
      - WEKNORA_BASE_URL=${WEKNORA_BASE_URL:-http://app:8080}
      - WEKNORA_TENANT_ID=${WEKNORA_TENANT_ID:-1}
    volumes:
      - ../../integrations/llm-wiki-public/authorization/public-manifest.json:/app/public-manifest.json:ro
      - public-bff-sqlite-data:/data/public-bff
    depends_on:
      app:
        condition: service_started
    networks:
      - default
      - WeKnora-network
    restart: unless-stopped

  public-web:
    container_name: llm-wiki-public-web
    build:
      context: ../../integrations/llm-wiki-public/web
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8090}:80"
    depends_on:
      - public-bff
    networks:
      - default
    restart: unless-stopped

volumes:
  weknora-sqlite-data:
    name: llm-wiki-public-weknora-sqlite-data
  public-bff-sqlite-data:
    name: llm-wiki-public-bff-sqlite-data
